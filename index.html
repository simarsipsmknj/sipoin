<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIPOIN</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/4/4f/Logo_smknj.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .iframe-container {
      width: 100%;
      height: 100vh;
    }
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwGdBlt6flvzMon_9qpSLQh6eFKYFKDx4fARzx8y2g2FZBgKcaUAf0lDf7E_ocYKHmw/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true">
    </iframe>
  </div>
</body>
</html>
